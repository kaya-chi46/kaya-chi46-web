name: Deploy to Firebase project Develop (develop)

on:
  push:
    branches: [develop]

jobs:
  deploy:
    name: 🚀 Deploy to Firebase Develop
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Verify Firebase Functions runtime
        run: |
          if ! grep -R -q --include='*.mjs' "firebase-functions/v2/https" .output/server; then
            echo "Firebase Functions v2 runtime was not generated"
            exit 1
          fi
          if grep -R -q --include='*.mjs' "firebase-functions/v1" .output/server; then
            echo "Firebase Functions v1 runtime was generated unexpectedly"
            exit 1
          fi

      - name: Install Firebase Functions dependencies
        run: |
          rm -rf .output/server/node_modules
          npm install --prefix .output/server --omit=dev --ignore-scripts

      # Google Cloud authentication
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KAYA_CHI46_WEB }}

      # Firebase CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.28.1

      # Deploy
      - name: Deploy to Firebase
        run: |
          firebase deploy --only hosting:develop,functions --project kaya-chi46-web
