name: Deploy to Firebase project Develop (develop)

on:
  push:
    branches: [develop]

jobs:
  deploy:
    name: 🚀 Deploy to Firebase Develop
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Volta will read the Node.js version from package.json
          cache: 'volta'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # Google Cloud authentication
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KAYA_CHI46_DEVELOP }}'

      # Firebase CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      # Deploy
      - name: Deploy to Firebase
        run: |
          firebase deploy --only hosting:develop,functions --project kaya-chi46-develop
